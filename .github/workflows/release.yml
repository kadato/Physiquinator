name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'

    - name: Verify .NET installation
      run: |
        dotnet --version
        dotnet --list-sdks
        dotnet --info

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore Physiquinator.csproj

    - name: Decode signing keystore
      run: |
        New-Item -ItemType Directory -Force -Path ./keystore
        [IO.File]::WriteAllBytes('./keystore/physiquinator-release.keystore', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    - name: Build Android APK
      run: |
        dotnet publish Physiquinator.csproj `
          -f net11.0-android `
          -c Release `
          -p:AndroidPackageFormat=apk `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore=./keystore/physiquinator-release.keystore `
          -p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD `
          -p:AndroidSigningKeyAlias=physiquinator `
          -p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD `
          -o ./artifacts/android
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ./artifacts/android/*-Signed.apk

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'

    - name: Verify .NET installation
      run: |
        dotnet --version
        dotnet --list-sdks
        dotnet --info

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore Physiquinator.csproj

    - name: Build Windows Package
      run: |
        dotnet publish Physiquinator.csproj `
          -f net11.0-windows10.0.19041.0 `
          -c Release `
          -p:WindowsPackageType=None `
          -o ./artifacts/windows

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: windows-package
        path: ./artifacts/windows/**/*

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./release/android

    - name: Download Windows package
      uses: actions/download-artifact@v4
      with:
        name: windows-package
        path: ./release/windows

    - name: Prepare release assets
      run: |
        cd release
        # Rename Android APK to user-friendly name
        if [ -f android/*-Signed.apk ]; then
          mv android/*-Signed.apk android/Physiquinator-Android.apk
        fi

        # Zip Windows build
        cd windows
        zip -r ../Physiquinator-Windows.zip .
        cd ..

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Physiquinator v${{ steps.get_version.outputs.version }}
        body: |
          ## Downloads

          ### Android
          - **Physiquinator-Android.apk** - Install on Android devices
            - You may need to enable "Install from Unknown Sources" in your device settings

          ### Windows
          - **Physiquinator-Windows.zip** - Extract and run on Windows 10/11
            - Extract the ZIP file
            - Run `Physiquinator.exe`

          ## Installation Instructions

          ### Android Installation
          1. Download `Physiquinator-Android.apk`
          2. Enable "Install from Unknown Sources" in Settings - Security
          3. Open the APK file to install

          ### Windows Installation
          1. Download `Physiquinator-Windows.zip`
          2. Extract all files to a folder
          3. Run `Physiquinator.exe`

          ---

          Built with .NET MAUI 11
        files: |
          release/android/Physiquinator-Android.apk
          release/Physiquinator-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
