name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore Physiquinator.Tests/Physiquinator.Tests.csproj

    - name: Build
      run: dotnet build Physiquinator.Tests/Physiquinator.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test Physiquinator.Tests/Physiquinator.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

    - name: Format check (Core + Tests)
      run: dotnet format Physiquinator.Core/Physiquinator.Core.csproj Physiquinator.Tests/Physiquinator.Tests.csproj --verify-no-changes --severity warn

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: xUnit Tests
        path: '**/test-results.trx'
        reporter: dotnet-trx
