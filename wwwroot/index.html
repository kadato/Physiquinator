<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color-meta" content="#0E0F17" />
    <title>Physiquinator</title>
    <base href="/" />
    <link rel="preload" href="_content/Physiquinator.UI/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="_content/Physiquinator.UI/fonts/jetbrains-mono-5.woff2" as="font" type="font/woff2" crossorigin />
    <script>
        (function () {
            const key = "physiquinator-theme-preference";
            const preference = localStorage.getItem(key) || "system";
            const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            let theme;
            if (preference === "system") {
                theme = isDark ? "dark" : "light";
            } else {
                theme = preference;
            }
            var lightThemes = { "light": 1, "tokyo-night-light": 1, "solarized-light": 1, "github-light": 1 };
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.themeMode = lightThemes[theme] ? "light" : "dark";
            // Keep the OS status bar / PWA theme-color in sync pre-paint.
            // Values mirror --pl-paper in tokens.css / DesignTokens.cs.
            var papers = { "dark": "#0E0F17", "light": "#E6E2D0", "tokyo-night": "#1A1B26", "tokyo-night-storm": "#24283B", "tokyo-night-moon": "#222436", "tokyo-night-light": "#D5D6DB", "dracula": "#282A36", "monokai": "#272822", "one-dark-pro": "#282C34", "nord": "#2E3440", "solarized-dark": "#002B36", "solarized-light": "#FDF6E3", "github-dark": "#0D1117", "github-light": "#FFFFFF", "night-owl": "#011627" };
            var meta = document.getElementById("theme-color-meta");
            if (meta && papers[theme]) { meta.setAttribute("content", papers[theme]); }
        })();
    </script>
    <style>
        html[data-theme-mode="dark"] body,
        html[data-theme="dark"] body {
            background-color: #0E0F17 !important;
            color: #C0CAF5;
        }
        html[data-theme-mode="light"] body,
        html[data-theme="light"] body {
            background-color: #E6E2D0 !important;
            color: #1A1B26;
        }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/tokens.css?v=94" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/app-overrides.css?v=96" />
    <link rel="stylesheet" href="Physiquinator.styles.css" />
    <style>
        /* MAUI WebView2 fallback. Shell only if stylesheets fail to load */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
        body { display: flex; flex-direction: column; }
        #app { display: flex; flex-direction: column; width: 100%; flex: 1 1 0%; min-height: 0; overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; overflow: hidden; }
        .app-main-scroll { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; }
        .app-tab-bar { flex-shrink: 0; }
        /* Startup splash - void #0E0F17 with volt plate centered: matches native MauiSplashScreen */
        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            background-color: #0E0F17;
            color: #C0CAF5;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .app-splash__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .app-splash__logo svg {
            width: min(68vmin, 320px);
            height: min(68vmin, 320px);
            display: block;
        }
        html[data-theme="light"] .app-splash {
        }
        /* Camera hole / display cutout and tall screens: let the WebView extend edge-to-edge
           and use the safe-area inset for the top. The status-bar-safe-area div provides
           the visible background behind the cutout. It must track --pl-paper for every
           theme: the native status icons use dark glyphs on light papers and light glyphs
           on dark papers, so a mismatched strip destroys contrast (e.g. dark icons on a
           dark fallback when tokyo-night-light is active). */
        .status-bar-safe-area {
            display: block;
            height: env(safe-area-inset-top, 0px);
            min-height: env(safe-area-inset-top, 0px);
            background: var(--pl-paper, #0E0F17);
            flex-shrink: 0;
        }
        /* Per-theme explicit paper fallback for pre-CSS paint and for WebViews where
           custom properties resolve late. Values mirror tokens.css --pl-paper. */
        html[data-theme="dark"] .status-bar-safe-area { background: #0E0F17; }
        html[data-theme="light"] .status-bar-safe-area { background: #E6E2D0; }
        html[data-theme="tokyo-night"] .status-bar-safe-area { background: #1A1B26; }
        html[data-theme="tokyo-night-storm"] .status-bar-safe-area { background: #24283B; }
        html[data-theme="tokyo-night-moon"] .status-bar-safe-area { background: #222436; }
        html[data-theme="tokyo-night-light"] .status-bar-safe-area { background: #D5D6DB; }
        html[data-theme="dracula"] .status-bar-safe-area { background: #282A36; }
        html[data-theme="monokai"] .status-bar-safe-area { background: #272822; }
        html[data-theme="one-dark-pro"] .status-bar-safe-area { background: #282C34; }
        html[data-theme="nord"] .status-bar-safe-area { background: #2E3440; }
        html[data-theme="solarized-dark"] .status-bar-safe-area { background: #002B36; }
        html[data-theme="solarized-light"] .status-bar-safe-area { background: #FDF6E3; }
        html[data-theme="github-dark"] .status-bar-safe-area { background: #0D1117; }
        html[data-theme="github-light"] .status-bar-safe-area { background: #FFFFFF; }
        html[data-theme="night-owl"] .status-bar-safe-area { background: #011627; }
        /* Tall screens (20:9, 21:9) - ensure the app fills the viewport even when the
           status bar is transparent and the content extends into the cutout. */
        html, body {
            min-height: 100dvh;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="_content/Physiquinator.UI/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="_content/Physiquinator.UI/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="_content/Physiquinator.UI/apple-touch-icon.png?v=2" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <output class="app-splash" aria-live="polite" aria-busy="true" aria-label="Loading application">
            <div class="app-splash__logo" aria-hidden="true">
                <!-- Volt plate #FAFF00 with centered figure, matches Resources/Splash/splash.svg and Android splash_logo.xml -->
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Physiquinator">
                    <rect x="150" y="150" width="220" height="220" fill="#414770"/>
                    <rect x="142" y="142" width="220" height="220" fill="#FAFF00" stroke="#10111A" stroke-width="4"/>
                    <path d="M142 142 H362 V146 H142 Z" fill="white" opacity="0.42"/>
                    <path d="M142 142 V362 H146 V142 Z" fill="white" opacity="0.42"/>
                    <g fill="#414770" transform="translate(6,6)">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                    <g fill="#10111A">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                </svg>
            </div>
        </output>
    </div>

    <script>
        // Fallback for WebViews without :has() support (Android <105): hide the HTML splash
        // as soon as Blazor mounts real content into #app.
        (function () {
            var app = document.getElementById('app');
            if (!app) return;
            function hide() {
                for (var i = 0; i < app.children.length; i++) {
                    if (!app.children[i].classList.contains('app-splash')) {
                        var s = app.querySelector('.app-splash');
                        if (s) s.style.display = 'none';
                        return true;
                    }
                }
                return false;
            }
            if (hide()) return;
            new MutationObserver(hide).observe(app, { childList: true });
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- sortable.min.js and html2canvas.min.js are lazy-loaded on demand -->
    <script defer src="_content/Physiquinator.UI/js/theme.js"></script>
    <script defer src="_content/Physiquinator.UI/js/stepperDrag.js"></script>
    <script defer src="_content/Physiquinator.UI/js/appHelpers.js"></script>
    <script defer src="_content/Physiquinator.UI/js/aiChat.js"></script>
    <script defer src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
