version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      dotnet:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: npm
    directories:
      - /
      - /tools/web-e2e
      - /tools/screenshot-generator
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      cloudflare:
        patterns:
          - cf
          - wrangler
          - '@cloudflare/*'
      playwright:
        patterns:
          - playwright
          - '@playwright/*'
