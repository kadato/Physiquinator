name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g., 1.9.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Validate version
      shell: bash
      run: |
        if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version '${{ inputs.version }}'. Use the form X.Y.Z (e.g. 1.9.0)."
          exit 1
        fi

    - name: Check tag does not exist
      shell: bash
      run: |
        if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" > /dev/null; then
          echo "Tag v${{ inputs.version }} already exists."
          exit 1
        fi

    - name: Bump ApplicationDisplayVersion
      shell: bash
      run: |
        sed -i -E \
          "s|<ApplicationDisplayVersion>[0-9.]+</ApplicationDisplayVersion>|<ApplicationDisplayVersion>${{ inputs.version }}</ApplicationDisplayVersion>|" \
          Physiquinator.csproj
        grep -n "ApplicationDisplayVersion" Physiquinator.csproj

    - name: Bump ApplicationVersion (Android versionCode)
      shell: bash
      run: |
        IFS='.' read -ra PARTS <<< "${{ inputs.version }}"
        CODE=$((PARTS[0] * 10000 + PARTS[1] * 100 + PARTS[2]))
        sed -i -E \
          "s|<ApplicationVersion>[0-9]+</ApplicationVersion>|<ApplicationVersion>$CODE</ApplicationVersion>|" \
          Physiquinator.csproj
        grep -n "ApplicationVersion" Physiquinator.csproj

    - name: Commit version bump
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Physiquinator.csproj
        if git diff --cached --quiet; then
          echo "No changes to commit; version already set."
        else
          git commit -m "build: bump app version to ${{ inputs.version }}"
          git push origin HEAD
        fi

    - name: Create and push tag
      shell: bash
      run: |
        git tag "v${{ inputs.version }}"
        git push origin "v${{ inputs.version }}"
