<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Physiquinator</title>
    <base href="/" />
    <script>
        (function () {
            var key = "physiquinator-theme-preference";
            var preference = localStorage.getItem(key) || "system";
            var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            var theme = preference === "system" ? (isDark ? "dark" : "light") : preference;
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <style>
        html[data-theme="dark"] body {
            background-color: #0B0C10 !important;
            color: #F3F4F6;
        }
        html[data-theme="light"] body {
            background-color: #F8F9FA !important;
            color: #111827;
        }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- Preload the Outfit font subsets so first text paint is not blocked -->
    <link rel="preload" href="_content/Physiquinator.UI/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="_content/Physiquinator.UI/fonts/outfit-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Do not add ?query to href — MAUI static web assets match exact routes only -->
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/app-overrides.css" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/Physiquinator.UI.styles.css" />
    <style>
        /* MAUI WebView2 fallback — shell only if stylesheets fail to load */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
        body { display: flex; flex-direction: column; }
        #app { display: flex; flex-direction: column; width: 100%; flex: 1 1 0%; min-height: 0; overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; overflow: hidden; }
        .app-main-scroll { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; }
        .app-tab-bar { flex-shrink: 0; }
        /* Startup splash fallback — full styling in app-overrides.css */
        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            background-color: #0B0C10;
            color: #F3F4F6;
        }
        html[data-theme="light"] .app-splash {
            background-color: #F8F9FA;
            color: #111827;
        }
    </style>
    <link rel="icon" type="image/png" href="_content/Physiquinator.UI/favicon.png" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="app-splash" role="status" aria-live="polite" aria-busy="true">
            <div class="app-splash__logo" aria-hidden="true">
                <svg viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#ffffff" transform="translate(60,60) scale(10.5)">
                        <circle cx="16" cy="6" r="4" />
                        <path d="M16,11 L2,16 L12,29 L20,29 L30,16 Z" />
                    </g>
                </svg>
            </div>
            <div class="app-splash__title">Physiquinator</div>
            <div class="app-splash__spinner" aria-hidden="true"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/Physiquinator.UI/js/sortable.min.js"></script>
    <script src="_content/Physiquinator.UI/js/theme.js"></script>
    <script src="_content/Physiquinator.UI/js/stepperDrag.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
