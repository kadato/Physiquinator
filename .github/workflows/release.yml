name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-android:
    runs-on: windows-latest
    needs: test
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_code: ${{ steps.version_code.outputs.code }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Get version
      id: get_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.100-preview.6.26359.118'
        dotnet-quality: 'preview'

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore Physiquinator.csproj

    - name: Decode signing keystore
      run: |
        New-Item -ItemType Directory -Force -Path ./keystore
        [IO.File]::WriteAllBytes('./keystore/physiquinator-release.keystore', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    - name: Compute Android versionCode
      id: version_code
      shell: bash
      run: |
        IFS='.' read -ra PARTS <<< "${{ steps.get_version.outputs.version }}"
        MAJOR="${PARTS[0]}"
        MINOR="${PARTS[1]:-0}"
        PATCH="${PARTS[2]:-0}"
        echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> $GITHUB_OUTPUT

    - name: Build Android APK
      run: |
        dotnet publish Physiquinator.csproj `
          -f net11.0-android `
          -c Release `
          -p:ApplicationDisplayVersion=${{ steps.get_version.outputs.version }} `
          -p:ApplicationVersion=${{ steps.version_code.outputs.code }} `
          -p:AndroidPackageFormat=apk `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore=./keystore/physiquinator-release.keystore `
          -p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD `
          -p:AndroidSigningKeyAlias=physiquinator `
          -p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD `
          -o ./artifacts/android
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Android APK
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: ./artifacts/android/*-Signed.apk

  build-windows:
    runs-on: windows-latest
    needs: [test, build-android]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.100-preview.6.26359.118'
        dotnet-quality: 'preview'

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore Physiquinator.csproj

    - name: Build Windows Package
      run: |
        dotnet publish Physiquinator.csproj `
          -f net11.0-windows10.0.19041.0 `
          -c Release `
          -p:ApplicationDisplayVersion=${{ needs.build-android.outputs.version }} `
          -p:ApplicationVersion=${{ needs.build-android.outputs.version_code }} `
          -p:WindowsPackageType=None `
          -o ./artifacts/windows

    - name: Upload Windows build
      uses: actions/upload-artifact@v7
      with:
        name: windows-package
        path: ./artifacts/windows/**/*

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./release/android

    - name: Download Windows package
      uses: actions/download-artifact@v4
      with:
        name: windows-package
        path: ./release/windows

    - name: Prepare release assets
      run: |
        cd release
        # Rename Android APK to user-friendly name
        if [ -f android/*-Signed.apk ]; then
          mv android/*-Signed.apk android/Physiquinator-Android.apk
        fi

        # Zip Windows build
        cd windows
        zip -r ../Physiquinator-Windows.zip .
        cd ..

    - name: Generate What's new notes
      shell: bash
      run: |
        VERSION="${{ needs.build-android.outputs.version }}"
        PREV=$(git tag --sort=-version:refname | grep -vx "v${VERSION}" | head -1 || true)
        echo "Previous tag: ${PREV:-<none>}"
        RANGE="${PREV:+${PREV}..}HEAD"
        FEATURES=$(git log "$RANGE" --no-merges --pretty=format:%s | grep -E '^feat' | sed -E 's/^feat(\([^)]*\))?: //' | sed 's/^./\U&/' || true)
        FIXES=$(git log "$RANGE" --no-merges --pretty=format:%s | grep -E '^fix' | sed -E 's/^fix(\([^)]*\))?: //' | sed 's/^./\U&/' || true)
        {
          echo "## What's new"
          echo ""
          if [ -n "$FEATURES" ]; then
            echo "### Features"
            echo "$FEATURES" | sed 's/^/- /'
            echo ""
          fi
          if [ -n "$FIXES" ]; then
            echo "### Bug fixes"
            echo "$FIXES" | sed 's/^/- /'
            echo ""
          fi
          if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
            echo "Improvements and under-the-hood changes."
            echo ""
          fi
        } > RELEASE_NOTES.md
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.build-android.outputs.version }}
        name: Physiquinator v${{ needs.build-android.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          release/android/Physiquinator-Android.apk
          release/Physiquinator-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
