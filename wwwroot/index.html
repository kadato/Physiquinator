<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Physiquinator</title>
    <base href="/" />
    <script>
        (function () {
            const key = "physiquinator-theme-preference";
            const preference = localStorage.getItem(key) || "system";
            const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            let theme;
            if (preference === "system") {
                theme = isDark ? "dark" : "light";
            } else {
                theme = preference;
            }
            var lightThemes = { "light": 1, "tokyo-night-light": 1, "solarized-light": 1, "github-light": 1 };
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.themeMode = lightThemes[theme] ? "light" : "dark";
        })();
    </script>
    <style>
        html[data-theme="dark"] body {
            background-color: #1A1B26 !important;
            color: #C0CAF5;
        }
        html[data-theme="light"] body {
            background-color: #D5D6DB !important;
            color: #1A1B26;
        }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/tokens.css?v=89" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/app-overrides.css?v=89" />
    <link rel="stylesheet" href="Physiquinator.styles.css" />
    <style>
        /* MAUI WebView2 fallback. Shell only if stylesheets fail to load */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
        body { display: flex; flex-direction: column; }
        #app { display: flex; flex-direction: column; width: 100%; flex: 1 1 0%; min-height: 0; overflow: hidden; }
        .app-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; overflow: hidden; }
        .app-main-scroll { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; }
        .app-tab-bar { flex-shrink: 0; }
        /* Startup splash - void #0E0F17 with volt plate centered: matches native MauiSplashScreen */
        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            background-color: #0E0F17;
            color: #C0CAF5;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .app-splash__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .app-splash__logo svg {
            width: min(68vmin, 320px);
            height: min(68vmin, 320px);
            display: block;
        }
        html[data-theme="light"] .app-splash {
            background-color: #E7E3D1;
            color: #1A1B26;
        }
        /* Camera hole / display cutout and tall screens: let the WebView extend edge-to-edge
           and use the safe-area inset for the top. The status-bar-safe-area div provides
           the visible background behind the cutout. */
        .status-bar-safe-area {
            display: block;
            height: env(safe-area-inset-top, 0px);
            min-height: env(safe-area-inset-top, 0px);
            background: #0E0F17;
            flex-shrink: 0;
        }
        html[data-theme="light"] .status-bar-safe-area {
            background: #E7E3D1;
        }
        /* Tall screens (20:9, 21:9) - ensure the app fills the viewport even when the
           status bar is transparent and the content extends into the cutout. */
        html, body {
            min-height: 100dvh;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="_content/Physiquinator.UI/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="_content/Physiquinator.UI/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="_content/Physiquinator.UI/apple-touch-icon.png?v=2" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <output class="app-splash" aria-live="polite" aria-busy="true" aria-label="Loading application">
            <div class="app-splash__logo" aria-hidden="true">
                <!-- Volt plate #FAFF00 with centered figure, matches Resources/Splash/splash.svg and Android splash_logo.xml -->
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Physiquinator">
                    <rect x="150" y="150" width="220" height="220" fill="#414770"/>
                    <rect x="142" y="142" width="220" height="220" fill="#FAFF00" stroke="#10111A" stroke-width="4"/>
                    <path d="M142 142 H362 V146 H142 Z" fill="white" opacity="0.42"/>
                    <path d="M142 142 V362 H146 V142 Z" fill="white" opacity="0.42"/>
                    <g fill="#414770" transform="translate(6,6)">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                    <g fill="#10111A">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                </svg>
            </div>
        </output>
    </div>

    <script>
        // Fallback for WebViews without :has() support (Android <105): hide the HTML splash
        // as soon as Blazor mounts real content into #app.
        (function () {
            var app = document.getElementById('app');
            if (!app) return;
            function hide() {
                for (var i = 0; i < app.children.length; i++) {
                    if (!app.children[i].classList.contains('app-splash')) {
                        var s = app.querySelector('.app-splash');
                        if (s) s.style.display = 'none';
                        return true;
                    }
                }
                return false;
            }
            if (hide()) return;
            new MutationObserver(hide).observe(app, { childList: true });
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- sortable.min.js and html2canvas.min.js are lazy-loaded on demand -->
    <script defer src="_content/Physiquinator.UI/js/theme.js"></script>
    <script defer src="_content/Physiquinator.UI/js/stepperDrag.js"></script>
    <script defer src="_content/Physiquinator.UI/js/appHelpers.js"></script>
    <script defer src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
