<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Physiquinator</title>
    <meta name="color-scheme" content="light dark" />
    <base href="/" />
    <link rel="preload" href="_content/Physiquinator.UI/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="_content/Physiquinator.UI/fonts/jetbrains-mono-5.woff2" as="font" type="font/woff2" crossorigin />
    <script>
        (function () {
            const key = "physiquinator-theme-preference";
            const preference = localStorage.getItem(key) || "system";
            const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            let theme;
            if (preference === "system") {
                theme = isDark ? "dark" : "light";
            } else {
                theme = preference;
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        html[data-theme="dark"] body {
            background-color: #1A1B26 !important;
            color: #C0CAF5;
        }
        html[data-theme="light"] body {
            background-color: #D5D6DB !important;
            color: #1A1B26;
        }
        /* Startup splash - void #0E0F17 with volt plate centered: matches native MauiSplashScreen
           Paints from raw HTML before Blazor boots, then hides itself as soon as any real content renders into #app. */
        .app-splash {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            background-color: #0E0F17;
            color: #C0CAF5;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .app-splash__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .app-splash__logo svg {
            width: min(68vmin, 320px);
            height: min(68vmin, 320px);
            display: block;
        }
        html[data-theme="light"] .app-splash {
            background-color: #E7E3D1;
            color: #1A1B26;
        }
        #app:has(> :not(.app-splash)) .app-splash {
            display: none;
        }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Physiquinator.UI/css/app-overrides.css?v=84" />
    <link rel="stylesheet" href="Physiquinator.Wasm.styles.css" />
    <link rel="icon" type="image/svg+xml" href="_content/Physiquinator.UI/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="_content/Physiquinator.UI/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="_content/Physiquinator.UI/apple-touch-icon.png?v=2" />
</head>

<body>
    <div id="app">
        <output class="app-splash" aria-live="polite" aria-busy="true" aria-label="Loading application">
            <div class="app-splash__logo" aria-hidden="true">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Physiquinator">
                    <rect x="150" y="150" width="220" height="220" fill="#414770"/>
                    <rect x="142" y="142" width="220" height="220" fill="#FAFF00" stroke="#10111A" stroke-width="4"/>
                    <path d="M142 142 H362 V146 H142 Z" fill="white" opacity="0.42"/>
                    <path d="M142 142 V362 H146 V142 Z" fill="white" opacity="0.42"/>
                    <g fill="#414770" transform="translate(6,6)">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                    <g fill="#10111A">
                        <rect x="234" y="182" width="36" height="46"/>
                        <polygon points="185,234 319,234 279,324 225,324"/>
                    </g>
                </svg>
            </div>
        </output>
    </div>

    <script>
        (function () {
            var app = document.getElementById('app');
            if (!app) return;
            function hide() {
                for (var i = 0; i < app.children.length; i++) {
                    if (!app.children[i].classList.contains('app-splash')) {
                        var s = app.querySelector('.app-splash');
                        if (s) s.style.display = 'none';
                        return true;
                    }
                }
                return false;
            }
            if (hide()) return;
            new MutationObserver(hide).observe(app, { childList: true });
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- sortable.min.js and html2canvas.min.js are lazy-loaded on demand -->
    <script defer src="_content/Physiquinator.UI/js/theme.js"></script>
    <script defer src="_content/Physiquinator.UI/js/stepperDrag.js"></script>
    <script defer src="_content/Physiquinator.UI/js/appHelpers.js"></script>
    <script defer src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/wasm-files.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
