name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-maui-windows:
    name: Build MAUI (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.100-preview.6.26359.118'
        dotnet-quality: 'preview'

    - name: Install MAUI Windows workload
      run: dotnet workload install maui-windows

    - name: Build MAUI Windows host
      run: dotnet build Physiquinator.csproj -f net11.0-windows10.0.19041.0 -p:TargetFrameworks=net11.0-windows10.0.19041.0 --configuration Release
