name: Deploy Web (Cloudflare Workers)

# Builds the Blazor WebAssembly host and deploys the static output to
# Cloudflare Workers Static Assets via the cf CLI. Static asset requests
# are free, and Cloudflare never runs a build, so the free tier stays
# untouched.
#
# One-time setup:
#   1. Create an API token from the "Edit Cloudflare Workers" template
#      (Workers Scripts: Edit permission)
#   2. Add repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# The first deploy creates the "physiquinator" Worker at
# https://physiquinator.kadatodev.workers.dev. After verifying it, delete
# the legacy Cloudflare Pages project (physiquinator.pages.dev).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm

    - name: Install WebAssembly tools workload
      run: dotnet workload install wasm-tools

    - name: Publish WASM host
      run: dotnet publish Physiquinator.Wasm/Physiquinator.Wasm.csproj --configuration Release -o ./artifacts/wasm-publish

    # .NET emits precompressed .br and .gz siblings. The edge compresses
    # itself, so shipping them would only double the upload size.
    # Source maps (.map) are only fetched with devtools open; never ship them.
    - name: Remove precompressed duplicates
      run: |
        find ./artifacts/wasm-publish/wwwroot -type f \( -name '*.br' -o -name '*.gz' \) -delete
        find ./artifacts/wasm-publish/wwwroot -type f -name '*.map' -delete
        echo "File count: $(find ./artifacts/wasm-publish/wwwroot -type f | wc -l)"

    - name: Install JS tooling
      run: npm ci

    - name: Deploy to Cloudflare Workers
      run: npx cf deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
