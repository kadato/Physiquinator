name: Deploy to Heroku

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency: heroku

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.100-preview.6.26359.118'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore Physiquinator.Tests/Physiquinator.Tests.csproj

    - name: Build
      run: dotnet build Physiquinator.Tests/Physiquinator.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test Physiquinator.Tests/Physiquinator.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

    - name: Format check (Core, UI, Web + Tests)
      run: |
        dotnet format Physiquinator.Core/Physiquinator.Core.csproj --verify-no-changes --severity warn
        dotnet format Physiquinator.UI/Physiquinator.UI.csproj --verify-no-changes --severity warn
        dotnet format Physiquinator.Web/Physiquinator.Web.csproj --verify-no-changes --severity warn
        dotnet format Physiquinator.Tests/Physiquinator.Tests.csproj --verify-no-changes --severity warn

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: xUnit Tests
        path: '**/test-results.trx'
        reporter: dotnet-trx

  deploy:
    name: Build, scan, and deploy web app
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Heroku Container Registry
      run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

    - name: Build image
      run: docker build -t registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web .

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: 1

    - name: Upload scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

    - name: Push image
      run: docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web

    - name: Release the web process
      run: |
        curl -X PATCH "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/formation" \
          -H "Accept: application/vnd.heroku+json; version=3" \
          -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"updates":[{"type":"web","docker_image":"registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web"}]}'

    - name: Wait for the app to become healthy
      run: |
        for i in $(seq 1 60); do
          if curl -fsS "https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/healthz" > /dev/null 2>&1; then
            echo "App is healthy."
            exit 0
          fi
          sleep 5
        done
        echo "App did not become healthy within 5 minutes." >&2
        exit 1
